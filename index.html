<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Wheel of Success!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Applied before first paint so there's no flash of the wrong theme. -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { DEFAULT: '#6633ff', dark: '#4c1fd6', light: '#a78bfa' } },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
              '50%': { transform: 'translate(0, -20px) scale(1.05)' }
            }
          },
          animation: {
            float: 'float 9s ease-in-out infinite',
            'float-slow': 'float 12s ease-in-out infinite'
          }
        }
      }
    }
  </script>
  <link href="css/styles.css" rel="stylesheet">
</head>

<body class="relative overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
  <!-- Decorative ambient blobs, purely visual -->
  <div class="pointer-events-none fixed -top-24 -left-24 h-72 w-72 animate-float rounded-full bg-brand/20 blur-3xl dark:bg-brand/25"
    aria-hidden="true"></div>
  <div class="pointer-events-none fixed -bottom-32 -right-16 h-80 w-80 animate-float-slow rounded-full bg-sky-400/20 blur-3xl dark:bg-sky-400/20"
    aria-hidden="true"></div>

  <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
    class="fixed right-4 top-4 z-[60] flex h-11 w-11 items-center justify-center rounded-full bg-white/80 text-slate-700 shadow-md ring-1 ring-slate-900/5 backdrop-blur transition hover:scale-105 dark:bg-slate-800/80 dark:text-slate-100">
    <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
  </button>

  <div class="main-container relative">
    <!-- #overlay's class is fully replaced by app.js (start/win/lose) and its two
         children are addressed by index (h2 then a), so both stay untouched here. -->
    <div id="overlay" class="start">
      <h2 class="title">Wheel of Success</h2>
      <a class="btn__reset">Start Game</a>
    </div>

    <div id="banner" class="section pt-10">
      <h2 class="header font-sans">Wheel of Success</h2>
      <div class="road-strip" aria-hidden="true">
        <div class="road-line"></div>
        <svg class="wheel" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="wheelGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6633ff" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="28" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
          <circle cx="32" cy="32" r="19" fill="url(#wheelGradient)" />
          <g stroke="#f1f5f9" stroke-width="3" stroke-linecap="round">
            <line x1="32" y1="15" x2="32" y2="24" />
            <line x1="32" y1="40" x2="32" y2="49" />
            <line x1="15" y1="32" x2="24" y2="32" />
            <line x1="40" y1="32" x2="49" y2="32" />
            <line x1="20" y1="20" x2="26" y2="26" />
            <line x1="38" y1="38" x2="44" y2="44" />
            <line x1="44" y1="20" x2="38" y2="26" />
            <line x1="26" y1="38" x2="20" y2="44" />
          </g>
          <circle cx="32" cy="32" r="6" fill="#f1f5f9" />
        </svg>
      </div>
    </div>

    <div id="phrase" class="section mx-auto w-full max-w-3xl px-4">
      <ul class="flex flex-wrap items-center justify-center gap-1.5"></ul>
    </div>

    <div id="qwerty" class="section mx-auto w-full max-w-2xl px-2">
      <div class="keyrow">
        <button>q</button><button>w</button><button>e</button><button>r</button><button>t</button><button>y</button><button>u</button><button>i</button><button>o</button><button>p</button>
      </div>
      <div class="keyrow">
        <button>a</button><button>s</button><button>d</button><button>f</button><button>g</button><button>h</button><button>j</button><button>k</button><button>l</button>
      </div>
      <div class="keyrow">
        <button>z</button><button>x</button><button>c</button><button>v</button><button>b</button><button>n</button><button>m</button>
      </div>
    </div>

    <div id="scoreboard" class="section pb-10">
      <ol class="flex items-center justify-center gap-2">
        <li class="tries"><img src="images/liveHeart.png" height="35px" width="30px" class="drop-shadow-sm"></li>
        <li class="tries"><img src="images/liveHeart.png" height="35px" width="30px" class="drop-shadow-sm"></li>
        <li class="tries"><img src="images/liveHeart.png" height="35px" width="30px" class="drop-shadow-sm"></li>
        <li class="tries"><img src="images/liveHeart.png" height="35px" width="30px" class="drop-shadow-sm"></li>
        <li class="tries"><img src="images/liveHeart.png" height="35px" width="30px" class="drop-shadow-sm"></li>
      </ol>
    </div>
  </div>
  <script type="text/javascript" src="js/app.js"></script>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
    });
  </script>
</body>

</html>
